name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Derleme kontrolü
        run: python3 -m compileall -q targz_converter

      - name: Kurulum listesi kontrolü
        run: python3 install.py --listele
