name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Sürümü doğrula
        run: |
          python3 -m compileall -q targz_converter
          python3 install.py --listele

      - name: GitHub Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            targz2app.py
            install.py
