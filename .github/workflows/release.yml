name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm zip

      - name: Verify sources
        run: |
          python3 -m compileall -q targz_converter
          python3 install.py --listele

      - name: Install appimagetool (extracted, no FUSE needed)
        run: |
          mkdir -p "$HOME/.local/bin"
          URL="https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          wget -q "$URL" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          cd /tmp
          rm -rf squashfs-root appimagetool-extracted
          /tmp/appimagetool --appimage-extract > /dev/null
          mv /tmp/squashfs-root /tmp/appimagetool-extracted
          printf '#!/bin/sh\nexec /tmp/appimagetool-extracted/AppRun "$@"\n' > "$HOME/.local/bin/appimagetool"
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/appimagetool" --version

      - name: Package ${{ matrix.arch }}
        run: |
          chmod +x ./tar-gz
          ARCH=${{ matrix.arch }} ./tar-gz linux targz
          ARCH=${{ matrix.arch }} ./tar-gz linux zip
          ARCH=${{ matrix.arch }} ./tar-gz linux rpm
          ARCH=${{ matrix.arch }} ./tar-gz linux appimage
          ls -lh build/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            build/*.tar.gz
            build/*.zip
            build/*.rpm
            build/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*/*
