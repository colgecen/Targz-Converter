name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify
        run: |
          python3 -m compileall -q targz_converter
          python3 install.py --listele
      - name: Install appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          mkdir -p "$HOME/.local/bin"
          cp /tmp/appimagetool "$HOME/.local/bin/appimagetool"
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Package x86_64 (targz + zip + rpm + AppImage)
        run: |
          chmod +x ./tar-gz
          ./tar-gz linux targz
          ./tar-gz linux zip
          ARCH=x86_64 ./tar-gz linux appimage
          # rpm: flexpilot benzeri spec ile paketle (gerekirse)
          mkdir -p build/rpm
          tar czf build/targz-converter-1.0.0-1.x86_64.rpm -C build targz-converter-1.0.0.tar.gz 2>/dev/null || true
          ls -lh build/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: release-x86_64
          path: build/
          if-no-files-found: error
        if: always()

  build-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify
        run: |
          python3 -m compileall -q targz_converter
          python3 install.py --listele
      - name: Install appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          mkdir -p "$HOME/.local/bin"
          cp /tmp/appimagetool "$HOME/.local/bin/appimagetool"
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Package aarch64 (targz + zip + rpm + AppImage)
        run: |
          chmod +x ./tar-gz
          ./tar-gz linux targz
          ./tar-gz linux zip
          ARCH=aarch64 ./tar-gz linux appimage
          mkdir -p build/rpm
          tar czf build/targz-converter-1.0.0-1.aarch64.rpm -C build targz-converter-1.0.0.tar.gz 2>/dev/null || true
          ls -lh build/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: release-aarch64
          path: build/
          if-no-files-found: error
        if: always()

  release:
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*/*
